services:
  - type: web
    name: tg-media-bot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FFMPEG_PRESET
        value: ultrafast
      - key: KEEP_ALIVE
        value: "1"
